{% extends 'core/base.html' %}
{% block title %}Тест атауын өзгерту — BilimAI{% endblock %}

{% block content %}
<div class="container page">
  <div style="max-width:520px;margin:0 auto">

    <a href="/teacher/" class="back-link">← Кабинетке</a>

    <div class="card">
      <div class="card-header">
        <span class="card-title">✏️ Тест атауын өзгерту</span>
      </div>
      <div class="card-body">

        <div style="margin-bottom:20px;padding:12px 16px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border)">
          <div style="font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:4px">ҚАЗІРГІ АТЫ</div>
          <div style="font-size:15px;font-weight:600">{{ quiz.title }}</div>
        </div>

        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ request.GET.next }}">

          <div class="form-group">
            <label class="form-label">Жаңа атау</label>
            <input
              type="text"
              name="title"
              class="form-control"
              value="{{ quiz.title }}"
              placeholder="Тест атауын енгізіңіз..."
              autofocus
              required
            >
          </div>

          <div style="display:flex;gap:10px;margin-top:8px">
            <button type="submit" class="btn btn-primary" style="flex:1">
              💾 Сақтау
            </button>
            <a href="{{ request.GET.next|default:'/teacher/' }}" class="btn btn-ghost">
              Бас тарту
            </a>
          </div>
        </form>

      </div>
    </div>

  </div>
</div>
{% endblock %}
