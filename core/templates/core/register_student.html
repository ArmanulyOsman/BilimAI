{% load static %}
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оқушы тіркелуі — BilimAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🎒</div>
      <div class="auth-title">Оқушы тіркелуі</div>
      <div class="auth-subtitle">BilimAI-ға қош келдіңіз!</div>
    </div>
    <div class="auth-body">
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="form-group">
            <label class="form-label">{{ field.label }}</label>
            <input type="{{ field.field.widget.input_type }}"
                   name="{{ field.html_name }}"
                   class="form-control"
                   placeholder="{{ field.label }}..."
                   value="{{ field.value|default:'' }}">
            {% if field.errors %}
              <div class="form-error">{{ field.errors.0 }}</div>
            {% endif %}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px">
          ✅ Тіркелу
        </button>
      </form>
      <div class="auth-footer" style="margin-top:20px">
        <a href="/register/">← Артқа</a> &nbsp;·&nbsp; <a href="/login/">Кіру</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
